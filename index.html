<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fornecedores CEASA • Fort Supermercados</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<!-- Inicialização instantânea do tema para evitar FOUC -->
<script>
  (function() {
    try {
      var saved = localStorage.getItem('portal_ceasa_theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved === 'dark' ? 'dark' : (saved === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ========================================================
   ESTRUTURA OFICIAL: FORNECEDORES CEASA — TOOL INTERFACE
   Identidade, tipografia e cores alinhadas com o Portal Fort
   ======================================================== */
:root {
  box-sizing: border-box;
  --yellow: #f1c73b;
  --red: #b3202c;
  --on-yellow: #1b1b1a;

  /* Tema Claro (Padrão) */
  --paper: #ffffff;
  --ink: #1b1b1a;
  --muted: #6b6b66;
  --border: #1b1b1a;
  --border-subtle: #d9d6cc;
  --row-border: #1b1b1a;
  --row-on: #fff6d1;
  --row-on-bar: #1b1b1a;
  --accent: #b3202c;
  --accent-link: #b3202c;
  --nav-bg: #f1c73b;
  --nav-ink: #1b1b1a;
  --nav-on-bg: #1b1b1a;
  --nav-on-ink: #f1c73b;
  --font: 'Archivo', system-ui, -apple-system, sans-serif;
}

:root[data-theme="dark"] {
  --paper: #161414;
  --ink: #f4f1ee;
  --muted: #a9a3a0;
  --border: #383434;
  --border-subtle: #2d2929;
  --row-border: #2e2929;
  --row-on: #2d2613;
  --row-on-bar: #f1c73b;
  --accent: #ee7a7f;
  --accent-link: #ee7a7f;
  --nav-bg: #f1c73b;
  --nav-ink: #1b1b1a;
  --nav-on-bg: #1b1b1a;
  --nav-on-ink: #f1c73b;
}

*, *::before, *::after {
  box-sizing: inherit;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.45;
  transition: background-color 0.15s ease, color 0.15s ease;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Tipografia Utilitária */
.k {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.c {
  font-stretch: 75%;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: -.01em;
  line-height: 1;
  margin: 0;
}

.id {
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
}

.l {
  color: var(--accent-link);
  text-decoration: underline;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
.l:hover {
  opacity: .85;
}

.ap {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  margin-left: 8px;
  letter-spacing: 0;
}

/* Layout Grid em 3 Colunas: 248px (Nav), 1fr (Lista), 420px (Ficha) */
.layout-grid {
  display: grid;
  grid-template-columns: 248px 1fr 420px;
  min-height: 100vh;
}
.layout-grid.no-aside {
  grid-template-columns: 248px 1fr;
}

/* Painel Esquerdo Amarelo de Navegação (Fixo e Sempre Visível) */
.nav-side {
  background: var(--nav-bg);
  color: var(--nav-ink);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  position: sticky;
  top: 0;
  height: 100vh;
  max-height: 100vh;
  z-index: 10;
}

.nav-side-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 24px;
  overflow-y: auto;
  min-height: 0;
  padding-right: 4px;
}
.nav-side-body::-webkit-scrollbar {
  width: 4px;
}
.nav-side-body::-webkit-scrollbar-thumb {
  background: rgba(27, 27, 26, 0.25);
  border-radius: 2px;
}

.nav-side-footer {
  flex-shrink: 0;
  padding-top: 18px;
  margin-top: auto;
  border-top: 1px solid rgba(27, 27, 26, 0.2);
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
}
.nav-side-footer button {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  cursor: pointer;
  color: var(--nav-ink);
  transition: opacity 0.15s ease;
}
.nav-side-footer button:hover {
  opacity: 0.75;
}
.nav-side-footer a {
  color: var(--nav-ink);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.nav-side-footer a:hover {
  text-decoration: underline;
}

.nv {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  color: var(--nav-ink);
  cursor: pointer;
  transition: background 0.12s ease;
}
.nv.on {
  background: var(--nav-on-bg);
  color: var(--nav-on-ink);
  padding: 12px 12px;
  border-top-color: var(--nav-on-bg);
}

/* Painel Central de Listagem */
.main-content {
  min-width: 0;
  background: var(--paper);
}

.main-header {
  padding: 24px 24px 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-input {
  flex: 1;
  border: 0;
  border-bottom: 2px solid var(--border);
  padding: 12px 0;
  font: inherit;
  font-size: 16px;
  background: transparent;
  color: var(--ink);
  outline: 0;
}
.search-input::placeholder {
  color: var(--muted);
}

.search-shortcut {
  border: 1px solid var(--border);
  padding: 3px 7px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink);
}

.actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 16px;
}

.btn-primary {
  background: var(--red);
  color: #fff;
  border: 0;
  padding: 0 16px;
  min-height: 44px;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.btn-primary:hover {
  opacity: 0.9;
}

/* Cabeçalho de Tabela */
.table-header {
  display: grid;
  grid-template-columns: 64px 1fr 56px;
  gap: 12px;
  padding: 10px 24px;
  border-top: 2px solid var(--border);
  border-bottom: 1px solid var(--border);
  color: var(--muted);
}

/* Linha de Registro da Tabela */
.r {
  display: grid;
  grid-template-columns: 64px 1fr 56px;
  gap: 12px;
  align-items: center;
  padding: 0 24px;
  height: 62px;
  box-sizing: border-box;
  border-bottom: 1px solid var(--border);
  color: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.12s ease;
}
.r.on {
  background: var(--row-on);
  box-shadow: inset 4px 0 0 var(--row-on-bar);
}
.r:hover:not(.on) {
  background: rgba(241, 199, 59, 0.12);
}

/* Linha de Fornecedor Inativo: Fundo vermelho e dados em branco */
.r.inativo {
  background: var(--red);
  color: #ffffff;
  border-bottom-color: rgba(255, 255, 255, 0.22);
}
.r.inativo .id,
.r.inativo .nm,
.r.inativo .ap,
.r.inativo .pr,
.r.inativo .q {
  color: #ffffff;
}
.r.inativo .ap,
.r.inativo .pr,
.r.inativo .q {
  color: rgba(255, 255, 255, 0.92);
}
.r.inativo:hover:not(.on) {
  background: #961922;
}
.r.inativo.on {
  background: #80141c;
  box-shadow: inset 4px 0 0 #ffffff;
}

/* Badges e Botões de Status */
.status-badge {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 2px;
}
.status-badge.ativo {
  background: rgba(27, 27, 26, 0.08);
  color: var(--ink);
  border: 1px solid var(--border);
}
[data-theme="dark"] .status-badge.ativo {
  background: rgba(241, 199, 59, 0.15);
  color: var(--yellow);
  border: 1px solid var(--yellow);
}
.status-badge.inativo {
  background: var(--red);
  color: #ffffff;
  border: 1px solid var(--red);
}

.status-tag-inativo {
  display: inline-block;
  background: #ffffff;
  color: var(--red);
  font-size: 9px;
  font-weight: 800;
  padding: 1px 5px;
  margin-left: 8px;
  letter-spacing: .05em;
  vertical-align: middle;
}

.status-btn {
  flex: 1;
  padding: 10px 14px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  border: 2px solid var(--border);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.12s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.status-btn.ativo-selected {
  background: #1b1b1a;
  color: #f1c73b;
  border-color: #1b1b1a;
}
[data-theme="dark"] .status-btn.ativo-selected {
  background: #f1c73b;
  color: #1b1b1a;
  border-color: #f1c73b;
}
.status-btn.inativo-selected {
  background: var(--red);
  color: #ffffff;
  border-color: var(--red);
}

.nm {
  font-size: 21px;
}
.pr {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 5px;
}
.q {
  font-size: 11px;
  color: var(--muted);
  text-align: right;
  font-weight: 600;
}

/* Coluna Direita: Ficha Técnica Detalhada (Fixa ao Rolar) */
.aside-detail {
  border-left: 2px solid var(--border);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-sizing: border-box;
  background: var(--paper);
  position: sticky;
  top: 0;
  height: 100vh;
  max-height: 100vh;
  overflow-y: auto;
}

.aside-title {
  font-size: 46px;
  margin: 8px 0 8px;
  word-break: break-word;
}

.pl {
  display: grid;
  grid-template-columns: 60px 1fr 28px;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
}

/* Notificação discreta */
.status-pill {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  padding: 4px 8px;
  border: 1px solid var(--accent);
  border-radius: 4px;
}

/* Modais estilizados no rigor do Design System */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-sheet {
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--border);
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
}
.modal-title {
  margin: 0 0 20px;
  font-weight: 800;
  font-stretch: 75%;
  font-size: 24px;
  text-transform: uppercase;
  line-height: 1;
}
.form-group {
  margin-bottom: 20px;
}
.form-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--border);
  border-radius: 0;
  color: var(--ink);
  font: inherit;
  font-size: 15px;
  padding: 8px 0;
  outline: none;
}
.form-input:focus {
  border-bottom-color: var(--accent);
}
.modal-actions {
  margin-top: 28px;
  display: flex;
  justify-content: flex-end;
  gap: 20px;
  align-items: center;
}

/* Seleção de Produtos no Modal */
.chips-box {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 0;
  max-height: 140px;
  overflow-y: auto;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
}
.chip button {
  background: none;
  border: 0;
  color: var(--accent);
  cursor: pointer;
  font-weight: 800;
}
.dropdown-box {
  border: 1px solid var(--border);
  background: var(--paper);
  max-height: 150px;
  overflow-y: auto;
  margin-top: 6px;
}
.dropdown-item {
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  text-align: left;
}
.dropdown-item:hover {
  background: var(--yellow);
  color: var(--on-yellow);
}
.dropdown-item.selected {
  font-weight: 700;
  color: var(--accent);
}

/* Responsividade para telas menores */
@media (max-width: 1200px) {
  .layout-grid {
    grid-template-columns: 220px 1fr;
  }
  .aside-detail {
    position: fixed;
    top: 0;
    right: 0;
    width: 420px;
    height: 100vh;
    z-index: 50;
    box-shadow: -8px 0 32px rgba(0,0,0,0.3);
    overflow-y: auto;
  }
}
@media (max-width: 768px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
  .nav-side {
    padding: 20px 16px;
    gap: 16px;
  }
  .aside-detail {
    width: 100%;
  }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

function SistemaFornecedoresCEASA() {
  const API_BASE = '/api';
  const lsFornecedoresKey = 'ceasa_fornecedores_fornecedores_v2';
  const lsProdutosKey = 'ceasa_fornecedores_produtos_v2';
  const searchInputRef = useRef(null);

  // Tema Claro e Escuro
  const [theme, setTheme] = useState(() => {
    try {
      const saved = localStorage.getItem('portal_ceasa_theme');
      if (saved === 'dark' || saved === 'light') return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch {
      return 'light';
    }
  });

  useEffect(() => {
    try {
      localStorage.setItem('portal_ceasa_theme', theme);
    } catch {}
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  // Seções da Ferramenta ('fornecedores' | 'produtos')
  const [activeTab, setActiveTab] = useState('fornecedores');
  // Filtro secundário ('todos' | 'sem_vinculo')
  const [subFilter, setSubFilter] = useState('todos');
  const [searchTerm, setSearchTerm] = useState('');
  const [statusNotice, setStatusNotice] = useState('');
  const [isLoading, setIsLoading] = useState(false);

  // Dados
  const [fornecedores, setFornecedores] = useState(() => {
    try {
      const raw = localStorage.getItem(lsFornecedoresKey);
      const parsed = raw ? JSON.parse(raw) : null;
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  });

  const [produtos, setProdutos] = useState(() => {
    try {
      const raw = localStorage.getItem(lsProdutosKey);
      const parsed = raw ? JSON.parse(raw) : null;
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  });

  // ID do item selecionado para a coluna direita (Ficha Técnica)
  const [selectedId, setSelectedId] = useState(null);

  // Modais de Criação / Edição / Confirmação
  const [showModal, setShowModal] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [confirmModal, setConfirmModal] = useState(null);

  // Formulário de Fornecedor
  const [formData, setFormData] = useState({ codigo: '', nome: '', apelido: '', status: 'Ativo' });
  const [selectedProdutos, setSelectedProdutos] = useState([]);
  const [produtoSearchTerm, setProdutoSearchTerm] = useState('');
  const [showDropdown, setShowDropdown] = useState(false);

  // Formulário de Produto
  const [produtoFormData, setProdutoFormData] = useState({ codigo: '', nome: '' });

  const notify = (msg) => {
    setStatusNotice(msg);
    setTimeout(() => setStatusNotice(''), 3500);
  };

  // Carregar dados da API
  const loadData = async (silent = false) => {
    if (!silent) setIsLoading(true);
    try {
      const [prRes, fRes] = await Promise.all([
        fetch(`${API_BASE}/produtos`),
        fetch(`${API_BASE}/fornecedores`)
      ]);
      if (prRes.ok) {
        const pr = await prRes.json();
        if (Array.isArray(pr)) setProdutos(pr);
      }
      if (fRes.ok) {
        const f = await fRes.json();
        if (Array.isArray(f)) setFornecedores(f);
      }
      if (!silent) notify('Dados sincronizados com o servidor.');
    } catch {
      if (!silent) notify('Falha ao sincronizar com o servidor.');
    } finally {
      if (!silent) setIsLoading(false);
    }
  };

  useEffect(() => {
    loadData(true);
  }, []);

  useEffect(() => {
    try { localStorage.setItem(lsFornecedoresKey, JSON.stringify(fornecedores)); } catch {}
  }, [fornecedores]);

  useEffect(() => {
    try { localStorage.setItem(lsProdutosKey, JSON.stringify(produtos)); } catch {}
  }, [produtos]);

  // Atalho de Teclado '/' para a Busca
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        searchInputRef.current?.focus();
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  // Mapeamento de quais fornecedores vendem cada produto
  const fornecedoresDoProdutoMap = useMemo(() => {
    const map = {};
    produtos.forEach(p => {
      const pNome = (p.nome || '').trim().toLowerCase();
      const list = fornecedores.filter(f => {
        if (Array.isArray(f.produtoIds) && f.produtoIds.length > 0) {
          return f.produtoIds.includes(p.id);
        }
        if (f.produtos) {
          const prodNames = f.produtos.split(',').map(s => s.trim().toLowerCase());
          return prodNames.includes(pNome);
        }
        return false;
      });
      map[p.id] = list;
    });
    return map;
  }, [fornecedores, produtos]);

  // Contagem de Vínculos Ativos
  const totalVinculacoes = useMemo(() => {
    return fornecedores.reduce((acc, f) => {
      if (Array.isArray(f.produtoIds) && f.produtoIds.length > 0) return acc + f.produtoIds.length;
      if (f.produtos) return acc + f.produtos.split(',').filter(Boolean).length;
      return acc;
    }, 0);
  }, [fornecedores]);

  // Função para desmembrar título e unidade do produto (ex: TOMATE CARMEM KG -> Tomate Carmem | KG)
  const parseProductDetails = (nome) => {
    const parts = (nome || '').trim().split(' ');
    const last = parts[parts.length - 1];
    if (['KG', 'UN', 'BDJ', 'PT', 'CX', 'LT', 'DZ', '500G', '180G'].includes(last?.toUpperCase())) {
      return {
        name: parts.slice(0, -1).join(' '),
        unit: last.toUpperCase()
      };
    }
    return { name: nome || '', unit: 'UN' };
  };

  const norm = (s) => (s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

  // Contagens por Status de Fornecedores
  const ativosCount = useMemo(() => {
    return fornecedores.filter(f => (f.status || 'Ativo') !== 'Inativo').length;
  }, [fornecedores]);

  const inativosCount = useMemo(() => {
    return fornecedores.filter(f => f.status === 'Inativo').length;
  }, [fornecedores]);

  // Fornecedores Filtrados
  const filteredFornecedores = useMemo(() => {
    let list = fornecedores;
    if (subFilter === 'ativos') {
      list = list.filter(f => (f.status || 'Ativo') !== 'Inativo');
    } else if (subFilter === 'inativos') {
      list = list.filter(f => f.status === 'Inativo');
    } else if (subFilter === 'sem_vinculo') {
      list = list.filter(f => {
        const pIds = Array.isArray(f.produtoIds) ? f.produtoIds : [];
        const pStr = (f.produtos || '').split(',').filter(Boolean);
        return pIds.length === 0 && pStr.length === 0;
      });
    }
    if (!searchTerm) return list;
    const q = norm(searchTerm);
    return list.filter(f =>
      norm(f.codigo).includes(q) ||
      norm(f.nome).includes(q) ||
      norm(f.apelido).includes(q) ||
      norm(f.produtos).includes(q) ||
      norm(f.status || 'Ativo').includes(q)
    );
  }, [fornecedores, subFilter, searchTerm]);

  // Produtos Filtrados
  const filteredProdutos = useMemo(() => {
    let list = produtos;
    if (subFilter === 'sem_vinculo') {
      list = list.filter(p => (fornecedoresDoProdutoMap[p.id] || []).length === 0);
    }
    if (!searchTerm) return list;
    const q = norm(searchTerm);
    return list.filter(p => {
      const matchP = norm(p.codigo).includes(q) || norm(p.nome).includes(q);
      const suppliers = fornecedoresDoProdutoMap[p.id] || [];
      const matchS = suppliers.some(s =>
        norm(s.nome).includes(q) || norm(s.codigo).includes(q) || norm(s.apelido).includes(q)
      );
      return matchP || matchS;
    });
  }, [produtos, subFilter, searchTerm, fornecedoresDoProdutoMap]);

  // Seleciona automaticamente o primeiro item ao iniciar ou alternar aba
  useEffect(() => {
    if (activeTab === 'fornecedores' && filteredFornecedores.length > 0) {
      if (!selectedId || !filteredFornecedores.some(f => f.id === selectedId)) {
        setSelectedId(filteredFornecedores[0].id);
      }
    } else if (activeTab === 'produtos' && filteredProdutos.length > 0) {
      if (!selectedId || !filteredProdutos.some(p => p.id === selectedId)) {
        setSelectedId(filteredProdutos[0].id);
      }
    } else {
      setSelectedId(null);
    }
  }, [activeTab, subFilter]);

  // Objeto do Item Selecionado para a Coluna Direita
  const selectedItemData = useMemo(() => {
    if (!selectedId) return null;
    if (activeTab === 'fornecedores') {
      const f = fornecedores.find(item => item.id === selectedId);
      if (!f) return null;
      const rawProds = (String(f.produtos || '')).split(',').filter(Boolean).map(s => s.trim());
      const prodObjList = rawProds.map(pName => {
        const found = produtos.find(prod => (prod.nome || '').toLowerCase() === pName.toLowerCase());
        return found ? { codigo: found.codigo, nome: found.nome } : { codigo: '', nome: pName };
      });
      return { type: 'fornecedor', data: f, productList: prodObjList };
    } else {
      const p = produtos.find(item => item.id === selectedId);
      if (!p) return null;
      const suppliers = fornecedoresDoProdutoMap[p.id] || [];
      return { type: 'produto', data: p, suppliers };
    }
  }, [selectedId, activeTab, fornecedores, produtos, fornecedoresDoProdutoMap]);

  // Contagem de sem vínculo
  const semVinculoCount = useMemo(() => {
    if (activeTab === 'fornecedores') {
      return fornecedores.filter(f => {
        const pIds = Array.isArray(f.produtoIds) ? f.produtoIds : [];
        const pStr = (f.produtos || '').split(',').filter(Boolean);
        return pIds.length === 0 && pStr.length === 0;
      }).length;
    } else {
      return produtos.filter(p => (fornecedoresDoProdutoMap[p.id] || []).length === 0).length;
    }
  }, [activeTab, fornecedores, produtos, fornecedoresDoProdutoMap]);

  // Exportar CSV
  const handleExportCSV = () => {
    if (activeTab === 'fornecedores') {
      const headers = ['Código', 'Nome', 'Apelido', 'Status', 'Produtos'];
      const rows = filteredFornecedores.map(f => [
        `"${f.codigo || ''}"`,
        `"${(f.nome || '').replace(/"/g, '""')}"`,
        `"${(f.apelido || '').replace(/"/g, '""')}"`,
        `"${f.status || 'Ativo'}"`,
        `"${(f.produtos || '').replace(/"/g, '""')}"`
      ]);
      const csv = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const link = document.createElement('a');
      link.href = encodeURI(csv);
      link.download = `fornecedores_ceasa_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      notify(`${filteredFornecedores.length} fornecedor(es) exportado(s).`);
    } else {
      const headers = ['Código', 'Nome do Produto', 'Fornecedores'];
      const rows = filteredProdutos.map(p => {
        const suppliers = fornecedoresDoProdutoMap[p.id] || [];
        const suppStr = suppliers.map(s => `${s.codigo} - ${s.nome}`).join('; ');
        return [
          `"${p.codigo || ''}"`,
          `"${(p.nome || '').replace(/"/g, '""')}"`,
          `"${suppStr.replace(/"/g, '""')}"`
        ];
      });
      const csv = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const link = document.createElement('a');
      link.href = encodeURI(csv);
      link.download = `produtos_ceasa_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      notify(`${filteredProdutos.length} produto(s) exportado(s).`);
    }
  };

  const handleOpenModal = (item = null) => {
    if (activeTab === 'fornecedores') {
      if (item) {
        setEditingId(item.id);
        setFormData({
          codigo: item.codigo || '',
          nome: item.nome || '',
          apelido: item.apelido || '',
          status: item.status || 'Ativo'
        });
        if (Array.isArray(item.produtoIds)) {
          setSelectedProdutos(item.produtoIds);
        } else {
          const arr = (item.produtos || '').split(',').map(p => p.trim()).map(n => {
            const found = produtos.find(prod => (prod.nome || '').toLowerCase() === n.toLowerCase());
            return found ? found.id : null;
          }).filter(Boolean);
          setSelectedProdutos(arr);
        }
      } else {
        setEditingId(null);
        setFormData({ codigo: '', nome: '', apelido: '', status: 'Ativo' });
        setSelectedProdutos([]);
      }
    } else {
      if (item) {
        setEditingId(item.id);
        setProdutoFormData({ codigo: item.codigo || '', nome: item.nome || '' });
      } else {
        setEditingId(null);
        setProdutoFormData({ codigo: '', nome: '' });
      }
    }
    setProdutoSearchTerm('');
    setShowDropdown(false);
    setShowModal(true);
  };

  const handleCloseModal = () => {
    setShowModal(false);
    setEditingId(null);
    setFormData({ codigo: '', nome: '', apelido: '', status: 'Ativo' });
    setProdutoFormData({ codigo: '', nome: '' });
    setSelectedProdutos([]);
    setShowDropdown(false);
  };

  const handleSaveFornecedor = async () => {
    if (!formData.codigo || !formData.nome) {
      notify('Código e Razão Social são obrigatórios.');
      return;
    }
    const payload = {
      codigo: formData.codigo,
      nome: formData.nome,
      apelido: formData.apelido,
      status: formData.status || 'Ativo',
      produtoIds: selectedProdutos
    };
    try {
      if (editingId) {
        const res = await fetch(`${API_BASE}/fornecedores?id=${editingId}&_method=PUT`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const saved = await res.json();
        setFornecedores(fornecedores.map(f => f.id === editingId ? saved : f));
        setSelectedId(saved.id);
        notify(`Fornecedor ${saved.nome} atualizado.`);
      } else {
        const res = await fetch(`${API_BASE}/fornecedores`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const saved = await res.json();
        setFornecedores([...fornecedores, saved]);
        setSelectedId(saved.id);
        notify(`Fornecedor ${saved.nome} cadastrado.`);
      }
      handleCloseModal();
    } catch {
      notify('Erro ao salvar no servidor.');
    }
  };

  const handleToggleStatus = async (fornecedor) => {
    const newStatus = fornecedor.status === 'Inativo' ? 'Ativo' : 'Inativo';
    const payload = {
      codigo: fornecedor.codigo,
      nome: fornecedor.nome,
      apelido: fornecedor.apelido,
      status: newStatus,
      produtoIds: fornecedor.produtoIds || []
    };
    try {
      const res = await fetch(`${API_BASE}/fornecedores?id=${fornecedor.id}&_method=PUT`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const saved = await res.json();
      setFornecedores(fornecedores.map(f => f.id === fornecedor.id ? saved : f));
      notify(`Status alterado para ${newStatus}.`);
    } catch {
      notify('Erro ao alterar status.');
    }
  };

  const handleSaveProduto = async () => {
    if (!produtoFormData.codigo || !produtoFormData.nome) {
      notify('Código e Descrição do Produto são obrigatórios.');
      return;
    }
    try {
      if (editingId) {
        const res = await fetch(`${API_BASE}/produtos?id=${editingId}&_method=PUT`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(produtoFormData)
        });
        const saved = await res.json();
        setProdutos(produtos.map(p => p.id === editingId ? saved : p));
        setSelectedId(saved.id);
        notify(`Produto ${saved.nome} atualizado.`);
      } else {
        const res = await fetch(`${API_BASE}/produtos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(produtoFormData)
        });
        const saved = await res.json();
        setProdutos([...produtos, saved]);
        setSelectedId(saved.id);
        notify(`Produto ${saved.nome} cadastrado.`);
      }
      handleCloseModal();
    } catch {
      notify('Erro ao salvar produto.');
    }
  };

  const handleDelete = (id, nome) => {
    const isF = activeTab === 'fornecedores';
    setConfirmModal({
      title: isF ? 'Excluir Fornecedor' : 'Excluir Produto',
      message: `Tem certeza que deseja excluir "${nome}"? Esta operação desfaz todos os vínculos.`,
      onConfirm: async () => {
        try {
          if (isF) {
            await fetch(`${API_BASE}/fornecedores?id=${id}&_method=DELETE`, { method: 'POST' });
            setFornecedores(fornecedores.filter(f => f.id !== id));
            notify('Fornecedor excluído com sucesso.');
          } else {
            await fetch(`${API_BASE}/produtos?id=${id}&_method=DELETE`, { method: 'POST' });
            setProdutos(produtos.filter(p => p.id !== id));
            notify('Produto excluído com sucesso.');
          }
          if (selectedId === id) setSelectedId(null);
        } catch {
          notify('Erro ao excluir registro.');
        }
        setConfirmModal(null);
      }
    });
  };

  const toggleProduto = (id) => {
    setSelectedProdutos(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  const filteredDropdownProdutos = useMemo(() => {
    if (!produtoSearchTerm) return produtos;
    const q = norm(produtoSearchTerm);
    return produtos.filter(p => norm(p.codigo).includes(q) || norm(p.nome).includes(q));
  }, [produtos, produtoSearchTerm]);

  return (
    <div className={`layout-grid ${!selectedItemData ? 'no-aside' : ''}`}>
      {/* ========================================================
          COLUNA 1 (248px): NAVEGAÇÃO LATERAL AMARELA
          ======================================================== */}
      <nav className="nav-side" aria-label="Navegação">
        <div className="nav-side-body">
          <div>
            <div className="k">Fort Supermercados · Suprimentos</div>
            <h1 className="c" style={{ fontSize: '21px', marginTop: '10px' }}>Fornecedores CEASA</h1>
          </div>

          <div>
            <a
              className={`nv ${activeTab === 'fornecedores' ? 'on' : ''}`}
              href="#"
              onClick={(e) => { e.preventDefault(); setActiveTab('fornecedores'); setSubFilter('todos'); }}
            >
              <span>Fornecedores</span>
              <span>{fornecedores.length}</span>
            </a>

            <a
              className={`nv ${activeTab === 'produtos' ? 'on' : ''}`}
              href="#"
              onClick={(e) => { e.preventDefault(); setActiveTab('produtos'); setSubFilter('todos'); }}
            >
              <span>Produtos &amp; Fornecedores</span>
              <span>{produtos.length}</span>
            </a>

            <a
              className="nv"
              href="#"
              style={{ borderBottom: '1px solid var(--border)' }}
              onClick={(e) => { e.preventDefault(); setActiveTab('fornecedores'); }}
            >
              <span>Vínculos ativos</span>
              <span>{totalVinculacoes}</span>
            </a>
          </div>

          <div>
            <div className="k" style={{ marginBottom: '8px' }}>Filtros</div>
            <a
              className={`nv ${subFilter === 'todos' ? 'on' : ''}`}
              href="#"
              onClick={(e) => { e.preventDefault(); setSubFilter('todos'); }}
            >
              <span>Todos</span>
              <span>{activeTab === 'fornecedores' ? fornecedores.length : produtos.length}</span>
            </a>

            {activeTab === 'fornecedores' && (
              <>
                <a
                  className={`nv ${subFilter === 'ativos' ? 'on' : ''}`}
                  href="#"
                  onClick={(e) => { e.preventDefault(); setSubFilter('ativos'); }}
                >
                  <span>Ativos</span>
                  <span>{ativosCount}</span>
                </a>

                <a
                  className={`nv ${subFilter === 'inativos' ? 'on' : ''}`}
                  href="#"
                  onClick={(e) => { e.preventDefault(); setSubFilter('inativos'); }}
                >
                  <span>Inativos</span>
                  <span>{inativosCount}</span>
                </a>
              </>
            )}

            <a
              className={`nv ${subFilter === 'sem_vinculo' ? 'on' : ''}`}
              href="#"
              style={{ borderBottom: '1px solid var(--border)' }}
              onClick={(e) => { e.preventDefault(); setSubFilter('sem_vinculo'); }}
            >
              <span>{activeTab === 'fornecedores' ? 'Sem produto vinculado' : 'Sem fornecedor vinculado'}</span>
              <span>{semVinculoCount}</span>
            </a>
          </div>
        </div>

        {/* Rodapé Fixo da Barra de Navegação: Seletor de Tema e Link ao Portal */}
        <div className="nav-side-footer">
          <span>
            Tema:{' '}
            <button
              type="button"
              onClick={() => setTheme('light')}
              style={{
                fontWeight: theme === 'light' ? '800' : '500',
                textDecoration: theme === 'light' ? 'underline' : 'none'
              }}
            >
              Claro
            </button>
            {' / '}
            <button
              type="button"
              onClick={() => setTheme('dark')}
              style={{
                fontWeight: theme === 'dark' ? '800' : '500',
                textDecoration: theme === 'dark' ? 'underline' : 'none'
              }}
            >
              Escuro
            </button>
          </span>
          <a href="https://fmarechal.com" target="_blank" rel="noopener noreferrer">
            Portal Fort ↗
          </a>
        </div>
      </nav>

      {/* ========================================================
          COLUNA 2 (1fr): LISTAGEM CENTRAL
          ======================================================== */}
      <main className="main-content">
        <div className="main-header">
          {/* Barra de Busca Minimalista */}
          <div className="search-bar">
            <input
              ref={searchInputRef}
              aria-label="Buscar"
              className="search-input"
              placeholder={activeTab === 'fornecedores' ? 'Buscar fornecedor por código, nome, apelido ou produto...' : 'Buscar produto por código ou nome...'}
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              autoComplete="off"
            />
            <span className="search-shortcut k">/</span>
          </div>

          {/* Barra de Ações: Contagem, Exportação, Sincronização e Cadastro */}
          <div className="actions-bar">
            <span className="k" style={{ color: 'var(--muted)' }}>
              {activeTab === 'fornecedores'
                ? `${filteredFornecedores.length} fornecedores · ordem A–Z`
                : `${filteredProdutos.length} produtos · ordem A–Z`}
            </span>

            <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
              {statusNotice && <span className="status-pill">{statusNotice}</span>}
              <button type="button" className="l" onClick={handleExportCSV}>Exportar CSV</button>
              <button type="button" className="l" onClick={() => loadData(false)}>
                {isLoading ? 'Sincronizando...' : 'Sincronizar'}
              </button>
              <button
                type="button"
                className="btn-primary"
                onClick={() => handleOpenModal()}
              >
                + {activeTab === 'fornecedores' ? 'Novo fornecedor' : 'Novo produto'}
              </button>
            </div>
          </div>
        </div>

        {/* Cabeçalho da Tabela */}
        <div className="table-header k">
          <span>Cód.</span>
          <span style={{ color: 'var(--ink)' }}>{activeTab === 'fornecedores' ? 'Fornecedor ↓' : 'Produto ↓'}</span>
          <span style={{ textAlign: 'right' }}>{activeTab === 'fornecedores' ? 'Prod.' : 'Forn.'}</span>
        </div>

        {/* Linhas da Tabela de Fornecedores */}
        {activeTab === 'fornecedores' && (
          <div>
            {filteredFornecedores.map((f) => {
              const rawProds = (String(f.produtos || '')).split(',').filter(Boolean).map(s => s.trim());
              const prodObjList = rawProds.map(pName => {
                const found = produtos.find(prod => (prod.nome || '').toLowerCase() === pName.toLowerCase());
                return found ? { codigo: found.codigo, nome: found.nome } : { codigo: '', nome: pName };
              });
              const isSelected = selectedId === f.id;
              const isInativo = f.status === 'Inativo';

              return (
                <div
                  key={f.id}
                  className={`r ${isSelected ? 'on' : ''} ${isInativo ? 'inativo' : ''}`}
                  onClick={() => setSelectedId(f.id)}
                >
                  <span className="id">#{f.codigo}</span>
                  <div style={{ minWidth: 0 }}>
                    <div className="c nm">
                      {f.nome}
                      {f.apelido && <span className="ap">{f.apelido}</span>}
                      {isInativo && <span className="status-tag-inativo">INATIVO</span>}
                    </div>
                    <div className="pr">
                      {prodObjList.length === 0 ? (
                        'Nenhum produto vinculado'
                      ) : (
                        prodObjList.slice(0, 4).map(p => `${p.codigo ? '#' + p.codigo + ' ' : ''}${p.nome}`).join(' • ') +
                        (prodObjList.length > 4 ? ` +${prodObjList.length - 4}` : '')
                      )}
                    </div>
                  </div>
                  <span className="q">{prodObjList.length}</span>
                </div>
              );
            })}
            {filteredFornecedores.length === 0 && (
              <div style={{ padding: '36px 24px', color: 'var(--muted)', fontSize: '13px' }}>
                Nenhum fornecedor encontrado para os critérios selecionados.
              </div>
            )}
          </div>
        )}

        {/* Linhas da Tabela de Produtos */}
        {activeTab === 'produtos' && (
          <div>
            {filteredProdutos.map((p) => {
              const suppliers = fornecedoresDoProdutoMap[p.id] || [];
              const isSelected = selectedId === p.id;

              return (
                <div
                  key={p.id}
                  className={`r ${isSelected ? 'on' : ''}`}
                  onClick={() => setSelectedId(p.id)}
                >
                  <span className="id">#{p.codigo}</span>
                  <div style={{ minWidth: 0 }}>
                    <div className="c nm">{p.nome}</div>
                    <div className="pr">
                      {suppliers.length === 0 ? (
                        'Nenhum fornecedor vinculado'
                      ) : (
                        suppliers.slice(0, 4).map(s => `${s.codigo ? '#' + s.codigo + ' ' : ''}${s.nome}${s.apelido ? ' (' + s.apelido + ')' : ''}`).join(' • ') +
                        (suppliers.length > 4 ? ` +${suppliers.length - 4}` : '')
                      )}
                    </div>
                  </div>
                  <span className="q">{suppliers.length}</span>
                </div>
              );
            })}
            {filteredProdutos.length === 0 && (
              <div style={{ padding: '36px 24px', color: 'var(--muted)', fontSize: '13px' }}>
                Nenhum produto encontrado para os critérios selecionados.
              </div>
            )}
          </div>
        )}
      </main>

      {/* ========================================================
          COLUNA 3 (420px): FICHA DO FORNECEDOR / PRODUTO
          ======================================================== */}
      {selectedItemData && (
        <aside className="aside-detail" aria-label="Ficha técnica">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span className="k" style={{ color: 'var(--muted)' }}>
              {selectedItemData.type === 'fornecedor' ? 'Ficha do fornecedor' : 'Ficha do produto'}
            </span>
            <button type="button" className="l" onClick={() => setSelectedId(null)}>Fechar</button>
          </div>

          {selectedItemData.type === 'fornecedor' ? (
            <>
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <span className="id">#{selectedItemData.data.codigo}</span>
                  <span className={`status-badge ${(selectedItemData.data.status || 'Ativo') === 'Inativo' ? 'inativo' : 'ativo'}`}>
                    {(selectedItemData.data.status || 'Ativo') === 'Inativo' ? '● Inativo' : '● Ativo'}
                  </span>
                </div>
                <h2 className="c aside-title">{selectedItemData.data.nome}</h2>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '4px' }}>
                  <span className="k" style={{ color: 'var(--muted)' }}>
                    Apelido: {selectedItemData.data.apelido || '—'}
                  </span>
                  <button
                    type="button"
                    className="l"
                    style={{ fontSize: '11px', textTransform: 'uppercase' }}
                    onClick={() => handleToggleStatus(selectedItemData.data)}
                  >
                    Marcar {(selectedItemData.data.status || 'Ativo') === 'Inativo' ? 'Ativo' : 'Inativo'}
                  </button>
                </div>
              </div>

              <div style={{ display: 'flex', gap: '20px' }}>
                <button
                  type="button"
                  className="l"
                  onClick={() => handleOpenModal(selectedItemData.data)}
                >
                  Editar
                </button>
                <button
                  type="button"
                  className="l"
                  onClick={() => handleDelete(selectedItemData.data.id, selectedItemData.data.nome)}
                >
                  Excluir
                </button>
              </div>

              <div style={{ borderTop: '2px solid var(--border)', paddingTop: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span className="k">Produtos vinculados</span>
                <span className="k" style={{ color: 'var(--muted)' }}>{selectedItemData.productList.length}</span>
              </div>

              <div style={{ overflowY: 'auto', maxHeight: '52vh' }}>
                {selectedItemData.productList.map((p, idx) => {
                  const details = parseProductDetails(p.nome);
                  return (
                    <div key={idx} className="pl">
                      <span className="id">#{p.codigo || '—'}</span>
                      <span style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{details.name}</span>
                      <span style={{ textAlign: 'right' }}>{details.unit}</span>
                    </div>
                  );
                })}
                {selectedItemData.productList.length === 0 && (
                  <div style={{ padding: '16px 0', fontSize: '12px', color: 'var(--muted)' }}>
                    Nenhum produto vinculado a este fornecedor.
                  </div>
                )}
              </div>

              <button
                type="button"
                className="l"
                style={{ textAlign: 'left', marginTop: 'auto' }}
                onClick={() => handleOpenModal(selectedItemData.data)}
              >
                + Vincular produto
              </button>
            </>
          ) : (
            <>
              <div>
                <span className="id">#{selectedItemData.data.codigo}</span>
                <h2 className="c aside-title">{selectedItemData.data.nome}</h2>
                <span className="k" style={{ color: 'var(--muted)' }}>
                  Código do Catálogo: #{selectedItemData.data.codigo}
                </span>
              </div>

              <div style={{ display: 'flex', gap: '20px' }}>
                <button
                  type="button"
                  className="l"
                  onClick={() => handleOpenModal(selectedItemData.data)}
                >
                  Editar
                </button>
                <button
                  type="button"
                  className="l"
                  onClick={() => handleDelete(selectedItemData.data.id, selectedItemData.data.nome)}
                >
                  Excluir
                </button>
              </div>

              <div style={{ borderTop: '2px solid var(--border)', paddingTop: '10px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span className="k">Fornecedores que vendem</span>
                <span className="k" style={{ color: 'var(--muted)' }}>{selectedItemData.suppliers.length}</span>
              </div>

              <div style={{ overflowY: 'auto', maxHeight: '52vh' }}>
                {selectedItemData.suppliers.map((s, idx) => (
                  <div key={idx} className="pl" style={{ gridTemplateColumns: '60px 1fr auto' }}>
                    <span className="id">#{s.codigo || '—'}</span>
                    <span style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.nome}</span>
                    <span style={{ color: 'var(--muted)', fontSize: '11px', textAlign: 'right' }}>{s.apelido || ''}</span>
                  </div>
                ))}
                {selectedItemData.suppliers.length === 0 && (
                  <div style={{ padding: '16px 0', fontSize: '12px', color: 'var(--muted)' }}>
                    Nenhum fornecedor comercializa este produto.
                  </div>
                )}
              </div>

              <button
                type="button"
                className="l"
                style={{ textAlign: 'left', marginTop: 'auto' }}
                onClick={() => { setActiveTab('fornecedores'); handleOpenModal(); }}
              >
                + Cadastrar fornecedor
              </button>
            </>
          )}
        </aside>
      )}

      {/* ========================================================
          MODAL: CADASTRO / EDIÇÃO DE FORNECEDOR
          ======================================================== */}
      {showModal && activeTab === 'fornecedores' && (
        <div className="modal-overlay" onClick={handleCloseModal}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
            <h2 className="modal-title">{editingId ? 'Editar Fornecedor' : 'Novo Fornecedor'}</h2>

            <div className="form-group">
              <label className="form-label">Código *</label>
              <input
                className="form-input"
                type="text"
                placeholder="Ex: 1933"
                value={formData.codigo}
                onChange={(e) => setFormData({ ...formData, codigo: e.target.value })}
                required
              />
            </div>

            <div className="form-group">
              <label className="form-label">Apelido / Nome Fantasia</label>
              <input
                className="form-input"
                type="text"
                placeholder="Como é conhecido no box"
                value={formData.apelido}
                onChange={(e) => setFormData({ ...formData, apelido: e.target.value })}
              />
            </div>

            <div className="form-group">
              <label className="form-label">Razão Social / Nome Completo *</label>
              <input
                className="form-input"
                type="text"
                placeholder="Nome completo do fornecedor"
                value={formData.nome}
                onChange={(e) => setFormData({ ...formData, nome: e.target.value })}
                required
              />
            </div>

            <div className="form-group">
              <label className="form-label">Status do Fornecedor</label>
              <div style={{ display: 'flex', gap: '12px', marginTop: '6px' }}>
                <button
                  type="button"
                  onClick={() => setFormData({ ...formData, status: 'Ativo' })}
                  className={`status-btn ${(formData.status || 'Ativo') === 'Ativo' ? 'ativo-selected' : ''}`}
                >
                  ● Ativo
                </button>
                <button
                  type="button"
                  onClick={() => setFormData({ ...formData, status: 'Inativo' })}
                  className={`status-btn ${formData.status === 'Inativo' ? 'inativo-selected' : ''}`}
                >
                  ● Inativo
                </button>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">
                Produtos Vinculados ({selectedProdutos.length} selecionados)
              </label>

              <div className="chips-box" style={{ minHeight: '38px', borderBottom: '1px solid var(--border)', marginBottom: '8px' }}>
                {selectedProdutos.length === 0 ? (
                  <span style={{ color: 'var(--muted)', fontSize: '11px' }}>Nenhum produto selecionado. Busque abaixo para adicionar.</span>
                ) : (
                  selectedProdutos.map(id => {
                    const prod = produtos.find(p => p.id === id);
                    return prod ? (
                      <span key={id} className="chip">
                        <span>#{prod.codigo} {prod.nome}</span>
                        <button type="button" onClick={() => toggleProduto(id)}>✕</button>
                      </span>
                    ) : null;
                  })
                )}
              </div>

              <input
                className="form-input"
                type="text"
                placeholder="Buscar produtos para vincular..."
                value={produtoSearchTerm}
                onChange={e => setProdutoSearchTerm(e.target.value)}
                onFocus={() => setShowDropdown(true)}
              />

              {showDropdown && (
                <div className="dropdown-box">
                  <div style={{ display: 'flex', justifyContent: 'space-between', padding: '6px 10px', fontSize: '10px', fontWeight: 800, textTransform: 'uppercase', color: 'var(--muted)', borderBottom: '1px solid var(--border)' }}>
                    <span>Clique para marcar / desmarcar</span>
                    <button type="button" onClick={() => setShowDropdown(false)} style={{ background: 'none', border: 0, color: 'var(--muted)', cursor: 'pointer', fontWeight: 700 }}>✕ Fechar</button>
                  </div>
                  {filteredDropdownProdutos.map(prod => {
                    const isSelected = selectedProdutos.includes(prod.id);
                    return (
                      <button
                        key={prod.id}
                        type="button"
                        className={`dropdown-item ${isSelected ? 'selected' : ''}`}
                        onClick={() => toggleProduto(prod.id)}
                      >
                        <span>#{prod.codigo} - {prod.nome}</span>
                        {isSelected && <span>✓ Selecionado</span>}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            <div className="modal-actions">
              <button type="button" className="l" onClick={handleCloseModal}>Cancelar</button>
              <button type="button" className="btn-primary" onClick={handleSaveFornecedor}>
                {editingId ? 'Salvar Alterações' : 'Cadastrar Fornecedor'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================
          MODAL: CADASTRO / EDIÇÃO DE PRODUTO
          ======================================================== */}
      {showModal && activeTab === 'produtos' && (
        <div className="modal-overlay" onClick={handleCloseModal}>
          <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
            <h2 className="modal-title">{editingId ? 'Editar Produto' : 'Novo Produto'}</h2>

            <div className="form-group">
              <label className="form-label">Código do Produto *</label>
              <input
                className="form-input"
                type="text"
                placeholder="Ex: P102"
                value={produtoFormData.codigo}
                onChange={(e) => setProdutoFormData({ ...produtoFormData, codigo: e.target.value })}
                required
              />
            </div>

            <div className="form-group">
              <label className="form-label">Descrição / Nome do Item *</label>
              <input
                className="form-input"
                type="text"
                placeholder="Ex: Tomate Carmem 20kg"
                value={produtoFormData.nome}
                onChange={(e) => setProdutoFormData({ ...produtoFormData, nome: e.target.value })}
                required
              />
            </div>

            <div className="modal-actions">
              <button type="button" className="l" onClick={handleCloseModal}>Cancelar</button>
              <button type="button" className="btn-primary" onClick={handleSaveProduto}>
                {editingId ? 'Salvar Alterações' : 'Cadastrar Produto'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ========================================================
          MODAL: CONFIRMAÇÃO DE EXCLUSÃO
          ======================================================== */}
      {confirmModal && (
        <div className="modal-overlay" onClick={() => setConfirmModal(null)}>
          <div className="modal-sheet" style={{ maxWidth: '440px' }} onClick={(e) => e.stopPropagation()}>
            <h2 className="modal-title" style={{ color: 'var(--red)' }}>{confirmModal.title}</h2>
            <p style={{ margin: '0 0 20px', fontSize: '14px', lineHeight: '1.4' }}>{confirmModal.message}</p>
            <div className="modal-actions">
              <button type="button" className="l" onClick={() => setConfirmModal(null)}>Cancelar</button>
              <button type="button" className="btn-primary" onClick={confirmModal.onConfirm}>Confirmar Exclusão</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SistemaFornecedoresCEASA />);
</script>
</body>
</html>
