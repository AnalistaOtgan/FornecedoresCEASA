<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fornecedores CEASA</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#8a0000',
                dark: '#700000',
                light: '#a30000',
                50: '#fdf2f2',
                100: '#fde8e8',
                200: '#fbd5d5',
                700: '#8a0000',
                800: '#700000',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f3f4f6;
      }
      * { box-sizing: border-box; }
      html, body, #root {
        min-height: 100%;
        margin: 0;
      }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f3f4f6;
        color: #111827;
      }
      button, input, select, textarea { font: inherit; }

      @keyframes slide-in-left {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-left {
        animation: slide-in-left 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in {
        animation: fade-in 0.18s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script type="text/babel" data-presets="react">
      const { useState, useMemo, useEffect, useRef } = React;

      // Componentes de Ícones SVG alinhados com Lucide
      const Svg = ({ className, children }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{children}</svg>
      );
      const Search = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Svg>
      );
      const Plus = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Svg>
      );
      const Edit2 = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7 21H3v-4L17 3z" /></Svg>
      );
      const Trash2 = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" /></Svg>
      );
      const Package = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M16.5 9.4 7.5 4.21" /><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="M3.3 7L12 12l8.7-5" /></Svg>
      );
      const User = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M20 21a8 8 0 0 0-16 0" /><circle cx="12" cy="7" r="4" /></Svg>
      );
      const Users = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Svg>
      );
      const Hash = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><line x1="4" y1="9" x2="20" y2="9" /><line x1="4" y1="15" x2="20" y2="15" /><line x1="10" y1="3" x2="8" y2="21" /><line x1="16" y1="3" x2="14" y2="21" /></Svg>
      );
      const Tag = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M7 7h4l7 7-4 4-7-7V7z" /><circle cx="9" cy="9" r="1.5" /></Svg>
      );
      const X = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Svg>
      );
      const Download = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Svg>
      );
      const Eye = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></Svg>
      );
      const Check = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><polyline points="20 6 9 17 4 12" /></Svg>
      );
      const AlertTriangle = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Svg>
      );
      const AlertCircle = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></Svg>
      );
      const RefreshCw = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></Svg>
      );
      const Menu = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="18" x2="21" y2="18" /></Svg>
      );
      const ChevronRight = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><polyline points="9 18 15 12 9 6" /></Svg>
      );
      const Database = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></Svg>
      );
      const Info = ({ className = "w-4 h-4" }) => (
        <Svg className={className}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></Svg>
      );

      // Componente Logo estilizado igual ao Tramita/Atendimento
      const AppLogo = ({ size = 'normal' }) => {
        const containerSize = size === 'large' ? 'w-12 h-12' : 'w-8 h-8';
        const textSize = size === 'large' ? 'text-2xl sm:text-3xl' : 'text-lg sm:text-xl';

        return (
          <div className="flex items-center gap-2.5">
            <div className={`${containerSize} flex-shrink-0 rounded-lg overflow-hidden flex items-center justify-center bg-red-50 text-[#8a0000] border border-red-200/60 shadow-xs`}>
              <img
                src="/icone.png"
                alt="Logo CEASA"
                className="w-full h-full object-contain p-0.5"
                onError={(e) => {
                  e.target.style.display = 'none';
                  e.target.parentNode.innerHTML = '<span class="font-black text-[#8a0000] text-sm">FC</span>';
                }}
              />
            </div>
            <div className="flex flex-col">
              <span className={`font-bold text-gray-900 ${textSize} tracking-tight leading-none`}>
                Fornecedores CEASA
              </span>
              <span className="text-[10px] text-gray-500 font-medium tracking-wide uppercase mt-0.5">
                Gestão &amp; Cotações
              </span>
            </div>
          </div>
        );
      };

      // Toast Notification (padrão Atendimento com barra vermelha inferior)
      const AppNotification = ({ kind = 'info', title, message, onClose }) => {
        useEffect(() => {
          const timer = window.setTimeout(onClose, 5000);
          return () => window.clearTimeout(timer);
        }, [onClose, title, message]);

        const styles = {
          success: { icon: <Check className="w-5 h-5 text-emerald-700" />, iconClass: 'bg-emerald-50 text-emerald-700', border: 'border-emerald-200' },
          error: { icon: <AlertCircle className="w-5 h-5 text-red-700" />, iconClass: 'bg-red-50 text-red-700', border: 'border-red-200' },
          warning: { icon: <AlertTriangle className="w-5 h-5 text-amber-700" />, iconClass: 'bg-amber-50 text-amber-700', border: 'border-amber-200' },
          info: { icon: <Info className="w-5 h-5 text-blue-700" />, iconClass: 'bg-blue-50 text-blue-700', border: 'border-blue-200' },
        }[kind] || { icon: <Info className="w-5 h-5 text-blue-700" />, iconClass: 'bg-blue-50 text-blue-700', border: 'border-blue-200' };

        return (
          <div className="fixed right-4 top-4 z-[130] w-[calc(100%-2rem)] max-w-sm animate-fade-in" role="status" aria-live="polite">
            <div className={`overflow-hidden rounded-xl border ${styles.border} bg-white shadow-2xl`}>
              <div className="flex items-start gap-3 p-4">
                <div className={`flex h-10 w-10 flex-none items-center justify-center rounded-full ${styles.iconClass}`}>
                  {styles.icon}
                </div>
                <div className="min-w-0 flex-1 pt-0.5">
                  <p className="text-sm font-bold text-gray-900">{title}</p>
                  <p className="mt-0.5 text-xs leading-5 text-gray-600">{message}</p>
                </div>
                <button onClick={onClose} className="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-700" aria-label="Fechar notificação">
                  <X className="w-4 h-4" />
                </button>
              </div>
              <div className="h-1 bg-[#8a0000]" />
            </div>
          </div>
        );
      };

      // Modal de Confirmação (padrão ConfirmModal do Atendimento)
      const ConfirmModal = ({ isOpen, title, message, confirmLabel = 'Confirmar', cancelLabel = 'Cancelar', onConfirm, onCancel }) => {
        useEffect(() => {
          if (!isOpen) return;
          const handleKeyDown = (event) => event.key === 'Escape' && onCancel();
          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
        }, [isOpen, onCancel]);

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-[125] flex items-center justify-center p-4" role="dialog" aria-modal="true">
            <button className="absolute inset-0 bg-gray-950/50 backdrop-blur-xs w-full h-full border-0 cursor-default" onClick={onCancel} aria-label="Fechar confirmação" />
            <div className="relative z-10 w-full max-w-md overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-2xl animate-fade-in">
              <div className="h-1.5 bg-[#8a0000]" />
              <div className="p-6">
                <div className="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-amber-50 text-amber-700">
                  <AlertTriangle className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-gray-900">{title}</h3>
                <p className="mt-2.5 whitespace-pre-line text-sm leading-6 text-gray-600">{message}</p>
              </div>
              <div className="flex flex-col-reverse gap-2 border-t border-gray-100 bg-gray-50 p-4 sm:flex-row sm:justify-end">
                <button onClick={onCancel} className="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-100 transition-colors">
                  {cancelLabel}
                </button>
                <button onClick={onConfirm} className="rounded-lg bg-[#8a0000] px-4 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-[#a30000] transition-colors">
                  {confirmLabel}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // Cartão de Métrica / Resumo (estilo Atendimento SolicitorHome ServiceCards)
      const MetricCard = ({ title, count, subtitle, icon, accent, active, onClick }) => (
        <button
          type="button"
          onClick={onClick}
          className={`group relative flex flex-col rounded-2xl border p-4 sm:p-5 text-left transition-all duration-200 active:scale-[0.98] ${
            active
              ? 'border-red-300 bg-white ring-2 ring-red-100 shadow-md'
              : 'border-gray-200 bg-white hover:border-red-200 hover:shadow-md'
          }`}
        >
          <div className="flex items-center justify-between w-full">
            <span className={`flex h-11 w-11 items-center justify-center rounded-xl ${accent}`}>
              {icon}
            </span>
            <span className="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight tabular-nums">
              {count}
            </span>
          </div>
          <div className="mt-4 flex items-center justify-between gap-2 w-full">
            <span className="font-bold text-gray-900 text-sm sm:text-base">{title}</span>
            <ChevronRight className="w-4 h-4 text-gray-300 transition group-hover:translate-x-0.5 group-hover:text-red-700" />
          </div>
          <span className="mt-1 block text-xs leading-relaxed text-gray-500">{subtitle}</span>
          {active && <div className="absolute top-0 inset-x-6 h-0.5 bg-[#8a0000] rounded-b" />}
        </button>
      );

      // Célula de Detalhe no Modal de Visualização (DetailCell estilo Atendimento)
      const DetailCell = ({ label, value, wide = false, accent = false }) => (
        <div className={`${wide ? 'col-span-2' : ''} rounded-xl border p-3.5 ${accent ? 'border-red-100 bg-red-50/70' : 'border-gray-200 bg-white'}`}>
          <dt className="text-[11px] font-semibold uppercase tracking-wider text-gray-500">{label}</dt>
          <dd className={`mt-1 break-words text-sm font-bold ${accent ? 'text-red-900' : 'text-gray-900'}`}>{value}</dd>
        </div>
      );

      // Componente Principal
      function SistemaFornecedores() {
        const API_BASE = '/api';
        const lsFornecedoresKey = 'ceasa_fornecedores_fornecedores_v2';
        const lsProdutosKey = 'ceasa_fornecedores_produtos_v2';

        const [activeTab, setActiveTab] = useState('fornecedores');
        const [fornecedores, setFornecedores] = useState(() => {
          try {
            const raw = typeof window !== 'undefined' ? window.localStorage.getItem(lsFornecedoresKey) : null;
            const parsed = raw ? JSON.parse(raw) : null;
            return Array.isArray(parsed) ? parsed : [];
          } catch {
            return [];
          }
        });
        const [produtos, setProdutos] = useState(() => {
          try {
            const raw = typeof window !== 'undefined' ? window.localStorage.getItem(lsProdutosKey) : null;
            const parsed = raw ? JSON.parse(raw) : null;
            return Array.isArray(parsed) ? parsed : [];
          } catch {
            return [];
          }
        });

        const [searchTerm, setSearchTerm] = useState('');
        const [isLoading, setIsLoading] = useState(false);
        const [showModal, setShowModal] = useState(false);
        const [viewItem, setViewItem] = useState(null);
        const [editingId, setEditingId] = useState(null);
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

        // Formulário de Fornecedor
        const [formData, setFormData] = useState({ codigo: '', nome: '', apelido: '', produtos: '' });
        const [selectedProdutos, setSelectedProdutos] = useState([]);
        const [showProdutoDropdown, setShowProdutoDropdown] = useState(false);
        const [produtoSearchTerm, setProdutoSearchTerm] = useState('');

        // Formulário de Produto
        const [produtoFormData, setProdutoFormData] = useState({ codigo: '', nome: '' });

        // Notificações e Confirmações
        const [notification, setNotification] = useState(null);
        const [confirmation, setConfirmation] = useState(null);

        const askConfirmation = ({ title, message, confirmLabel, cancelLabel }) => {
          return new Promise((resolve) => {
            setConfirmation({
              title,
              message,
              confirmLabel,
              cancelLabel,
              resolve,
            });
          });
        };

        const answerConfirmation = (confirmed) => {
          if (confirmation?.resolve) confirmation.resolve(confirmed);
          setConfirmation(null);
        };

        const loadData = async (silent = false) => {
          if (!silent) setIsLoading(true);
          try {
            const [prRes, fRes] = await Promise.all([
              fetch(`${API_BASE}/produtos`),
              fetch(`${API_BASE}/fornecedores`)
            ]);
            if (prRes.ok) {
              const pr = await prRes.json();
              if (Array.isArray(pr)) setProdutos(pr);
            }
            if (fRes.ok) {
              const f = await fRes.json();
              if (Array.isArray(f)) setFornecedores(f);
            }
            if (!silent) {
              setNotification({ kind: 'success', title: 'Dados atualizados', message: 'Os dados foram sincronizados com sucesso.' });
            }
          } catch (err) {
            if (!silent) {
              setNotification({ kind: 'error', title: 'Falha ao sincronizar', message: 'Não foi possível carregar os dados mais recentes da API.' });
            }
          } finally {
            if (!silent) setIsLoading(false);
          }
        };

        useEffect(() => {
          loadData(true);
        }, []);

        useEffect(() => {
          try { window.localStorage.setItem(lsFornecedoresKey, JSON.stringify(fornecedores)); } catch {}
        }, [fornecedores]);

        useEffect(() => {
          try { window.localStorage.setItem(lsProdutosKey, JSON.stringify(produtos)); } catch {}
        }, [produtos]);

        // Mapeamento de quais fornecedores vendem cada produto
        const fornecedoresDoProdutoMap = useMemo(() => {
          const map = {};
          produtos.forEach(p => {
            const pNome = (p.nome || '').trim().toLowerCase();
            const list = fornecedores.filter(f => {
              if (Array.isArray(f.produtoIds) && f.produtoIds.length > 0) {
                return f.produtoIds.includes(p.id);
              }
              if (f.produtos) {
                const prodNames = f.produtos.split(',').map(s => s.trim().toLowerCase());
                return prodNames.includes(pNome);
              }
              return false;
            });
            map[p.id] = list;
          });
          return map;
        }, [fornecedores, produtos]);

        // Total de vínculos ativos
        const totalVinculacoes = useMemo(() => {
          return fornecedores.reduce((acc, f) => {
            if (Array.isArray(f.produtoIds) && f.produtoIds.length > 0) return acc + f.produtoIds.length;
            if (f.produtos) return acc + f.produtos.split(',').filter(Boolean).length;
            return acc;
          }, 0);
        }, [fornecedores]);

        const filteredFornecedores = useMemo(() => {
          if (!searchTerm) return fornecedores;
          const term = searchTerm.toLowerCase();
          return fornecedores.filter(f =>
            (f.codigo || '').toLowerCase().includes(term) ||
            (f.nome || '').toLowerCase().includes(term) ||
            (f.apelido || '').toLowerCase().includes(term) ||
            (f.produtos || '').toLowerCase().includes(term)
          );
        }, [fornecedores, searchTerm]);

        const filteredProdutos = useMemo(() => {
          if (!searchTerm) return produtos;
          const term = searchTerm.toLowerCase();
          return produtos.filter(p => {
            const matchCodeOrName = (p.codigo || '').toLowerCase().includes(term) || (p.nome || '').toLowerCase().includes(term);
            const suppliers = fornecedoresDoProdutoMap[p.id] || [];
            const matchSupplier = suppliers.some(s =>
              (s.nome || '').toLowerCase().includes(term) ||
              (s.codigo || '').toLowerCase().includes(term) ||
              (s.apelido || '').toLowerCase().includes(term)
            );
            return matchCodeOrName || matchSupplier;
          });
        }, [produtos, searchTerm, fornecedoresDoProdutoMap]);

        const handleExportCSV = () => {
          if (activeTab === 'fornecedores') {
            const headers = ['Código', 'Nome', 'Apelido', 'Produtos'];
            const rows = filteredFornecedores.map(f => [
              `"${f.codigo || ''}"`,
              `"${(f.nome || '').replace(/"/g, '""')}"`,
              `"${(f.apelido || '').replace(/"/g, '""')}"`,
              `"${(f.produtos || '').replace(/"/g, '""')}"`
            ]);
            const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `fornecedores_ceasa_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setNotification({ kind: 'success', title: 'Exportação concluída', message: `${filteredFornecedores.length} fornecedor(es) exportado(s) em CSV.` });
          } else {
            const headers = ['Código', 'Nome do Produto', 'Fornecedores'];
            const rows = filteredProdutos.map(p => {
              const suppliers = fornecedoresDoProdutoMap[p.id] || [];
              const suppStr = suppliers.map(s => `${s.codigo} - ${s.nome}`).join('; ');
              return [
                `"${p.codigo || ''}"`,
                `"${(p.nome || '').replace(/"/g, '""')}"`,
                `"${suppStr.replace(/"/g, '""')}"`
              ];
            });
            const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            link.setAttribute('download', `produtos_ceasa_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setNotification({ kind: 'success', title: 'Exportação concluída', message: `${filteredProdutos.length} produto(s) exportado(s) em CSV.` });

                setSelectedProdutos(produtosArray);

              setFormData({ codigo: '', nome: '', apelido: '', produtos: '' });

          try {
            if (editingId) {
              const res = await fetch(`${API_BASE}/fornecedores?id=${editingId}&_method=PUT`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
              const saved = await res.json();
              setFornecedores(fornecedores.map(f => f.id === editingId ? saved : f));
              setNotification({ kind: 'success', title: 'Fornecedor atualizado', message: `Dados de ${saved.nome} foram salvos com sucesso.` });

              const res = await fetch(`${API_BASE}/fornecedores`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

              setFornecedores([...fornecedores, saved]);
              setNotification({ kind: 'success', title: 'Fornecedor cadastrado', message: `${saved.nome} foi adicionado com sucesso.` });

            setNotification({ kind: 'error', title: 'Erro ao salvar', message: 'Ocorreu um erro ao comunicar com o servidor.' });
          }
          handleCloseModal();
        };

            if (editingId) {

              setProdutos(produtos.map(p => p.id === editingId ? saved : p));
              setNotification({ kind: 'success', title: 'Produto atualizado', message: `Produto ${saved.nome} atualizado com sucesso.` });

          const targetName = targetItem?.nome || 'este registro';

            title: isFornecedor ? 'Excluir Fornecedor?' : 'Excluir Produto?',

            confirmLabel: 'Excluir registro',
            cancelLabel: 'Cancelar',

            if (isFornecedor) {
              await fetch(`${API_BASE}/fornecedores?id=${id}&_method=DELETE`, { method: 'POST' });

              setNotification({ kind: 'success', title: 'Fornecedor removido', message: `${targetName} foi excluído.` });

              await fetch(`${API_BASE}/produtos?id=${id}&_method=DELETE`, { method: 'POST' });

              setNotification({ kind: 'success', title: 'Produto removido', message: `${targetName} foi excluído.` });

                            const suppliers = fornecedoresDoProdutoMap[produto.id] || [];

                            return (
                              <tr key={produto.id} className="hover:bg-gray-50/80 transition-colors">
                                <td className="px-5 py-3.5">
                                  <span className="font-mono bg-gray-100 text-gray-800 border border-gray-200 px-2 py-0.5 rounded text-xs font-bold inline-block">
                                    {produto.codigo}
                                  </span>
                                </td>
                                <td className="px-5 py-3.5">
                                  <span className="font-bold text-gray-900">{produto.nome}</span>
                                </td>
                                <td className="px-5 py-3.5">
                                  <div className="flex flex-wrap gap-1.5 max-w-lg">
                                    {suppliers.length === 0 ? (
                                      <span className="text-xs text-gray-400 italic">Nenhum fornecedor vinculado</span>
                                    ) : (
                                      suppliers.slice(0, 4).map((s, idx) => (
                                        <span key={s.id || idx} className="bg-gray-100 text-gray-800 border border-gray-200 px-2.5 py-0.5 rounded-full text-xs font-medium inline-flex items-center gap-1.5">
                                          <span className="font-bold text-[#8a0000]">#{s.codigo}</span>
                                          <span>{s.apelido || s.nome}</span>
                                        </span>
                                      ))
                                    )}
                                    {suppliers.length > 4 && (
                                      <span className="bg-red-50 text-[#8a0000] border border-red-200 px-2 py-0.5 rounded-full text-xs font-bold">
                                        +{suppliers.length - 4} mais
                                      </span>
                                    )}
                                  </div>
                                </td>
                                <td className="px-5 py-3.5 text-center">
                                  <div className="flex items-center justify-center gap-1">
                                    <button
                                      type="button"
                                      onClick={() => setViewItem({ type: 'produto', data: produto, suppliers })}
                                      className="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors"
                                      title="Visualizar detalhes"
                                    >
                                      <Eye className="w-4 h-4" />
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => handleOpenModal(produto)}
                                      className="p-1.5 text-blue-600 hover:text-blue-800 hover:bg-blue-50 rounded-lg transition-colors"
                                      title="Editar"
                                    >
                                      <Edit2 className="w-4 h-4" />
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => handleDelete(produto.id)}
                                      className="p-1.5 text-red-600 hover:text-red-800 hover:bg-red-50 rounded-lg transition-colors"
                                      title="Excluir"
                                    >
                                      <Trash2 className="w-4 h-4" />
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })
                        ) : (
                          <tr>
                            <td colSpan={4} className="px-6 py-14 text-center">
                              <div className="flex flex-col items-center justify-center gap-2">
                                <Package className="w-10 h-10 text-gray-300" />
                                <p className="font-bold text-gray-700 text-sm">Nenhum produto encontrado</p>
                                <p className="text-xs text-gray-400">Verifique o filtro de pesquisa ou cadastre um novo produto.</p>
                              </div>
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>

            {/* Modal de Detalhes / Ficha (Quick View estilo Atendimento) */}
            {viewItem && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
                <button className="absolute inset-0 bg-gray-950/50 backdrop-blur-xs w-full h-full border-0 cursor-default" onClick={() => setViewItem(null)} aria-label="Fechar modal" />
                <div className="relative z-10 w-full max-w-lg overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-2xl animate-fade-in">
                  <div className="h-1.5 bg-[#8a0000]" />
                  <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-red-50 text-[#8a0000] flex items-center justify-center">
                        <Eye className="w-4 h-4" />
                      </div>
                      <h2 className="text-lg font-bold text-gray-900">
                        {viewItem.type === 'fornecedor' ? 'Ficha do Fornecedor' : 'Detalhes do Produto'}
                      </h2>
                    </div>
                    <button onClick={() => setViewItem(null)} className="p-1 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                    {viewItem.type === 'fornecedor' ? (
                      <>
                        <div className="grid grid-cols-2 gap-3">
                          <DetailCell label="Código" value={`#${viewItem.data.codigo}`} accent />
                          <DetailCell label="Apelido" value={viewItem.data.apelido || '—'} />
                          <DetailCell label="Nome Completo / Razão" value={viewItem.data.nome} wide />
                        </div>

                        <div className="rounded-xl border border-gray-200 bg-white p-4">
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-xs font-bold uppercase tracking-wider text-gray-600 flex items-center gap-1.5">
                              <Package className="w-4 h-4 text-[#8a0000]" />
                              Produtos Fornecidos
                            </span>
                            <span className="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
                              {viewItem.productList.length} itens
                            </span>
                          </div>

                          <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto p-1">
                            {viewItem.productList.length === 0 ? (
                              <span className="text-xs text-gray-400 italic">Nenhum produto vinculado no momento.</span>
                            ) : (
                              viewItem.productList.map((p, idx) => (
                                <span key={idx} className="bg-red-50 text-red-900 border border-red-100 px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1 shadow-xs">
                                  {p.codigo && <span className="text-[#8a0000]">#{p.codigo}</span>}
                                  <span>{p.nome}</span>
                                </span>
                              ))
                            )}
                          </div>
                        </div>
                      </>
                    ) : (
                      <>
                        <div className="grid grid-cols-2 gap-3">
                          <DetailCell label="Código do Produto" value={`#${viewItem.data.codigo}`} accent />
                          <DetailCell label="Fornecedores Vinculados" value={viewItem.suppliers.length} />
                          <DetailCell label="Descrição do Produto" value={viewItem.data.nome} wide />
                        </div>

                        <div className="rounded-xl border border-gray-200 bg-white p-4">
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-xs font-bold uppercase tracking-wider text-gray-600 flex items-center gap-1.5">
                              <Users className="w-4 h-4 text-[#8a0000]" />
                              Fornecedores Que Vendem Este Item
                            </span>
                            <span className="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
                              {viewItem.suppliers.length} fornecedores
                            </span>
                          </div>

                          <div className="space-y-1.5 max-h-48 overflow-y-auto">
                            {viewItem.suppliers.length === 0 ? (
                              <span className="text-xs text-gray-400 italic">Nenhum fornecedor comercializa este item.</span>
                            ) : (
                              viewItem.suppliers.map((s) => (
                                <div key={s.id} className="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                                  <div className="flex items-center gap-2">
                                    <span className="font-mono text-xs font-bold text-[#8a0000] bg-red-50 border border-red-100 px-2 py-0.5 rounded">
                                      #{s.codigo}
                                    </span>
                                    <span className="text-xs sm:text-sm font-semibold text-gray-900">{s.nome}</span>
                                  </div>
                                  {s.apelido && (
                                    <span className="text-[11px] text-gray-500 bg-white border border-gray-200 px-2 py-0.5 rounded-full">
                                      {s.apelido}
                                    </span>
                                  )}
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      </>
                    )}
                  </div>

                  <div className="bg-gray-50 border-t border-gray-100 px-6 py-4 flex justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => setViewItem(null)}
                      className="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-100 transition-colors"
                    >
                      Fechar
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const item = viewItem.data;
                        setViewItem(null);
                        handleOpenModal(item);
                      }}
                      className="rounded-lg bg-[#8a0000] px-4 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-[#a30000] transition-colors flex items-center gap-1.5"
                    >
                      <Edit2 className="w-4 h-4" />
                      <span>Editar</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal de Criação / Edição de Fornecedores */}
            {showModal && activeTab === 'fornecedores' && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
                <button className="absolute inset-0 bg-gray-950/50 backdrop-blur-xs w-full h-full border-0 cursor-default" onClick={handleCloseModal} aria-label="Fechar formulário" />
                <div className="relative z-10 w-full max-w-lg overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-2xl animate-fade-in">
                  <div className="h-1.5 bg-[#8a0000]" />
                  <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h2 className="text-lg font-bold text-gray-900">
                      {editingId ? 'Editar Fornecedor' : 'Novo Fornecedor'}
                    </h2>
                    <button onClick={handleCloseModal} className="p-1 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Código *</label>
                        <input
                          type="text"
                          value={formData.codigo}
                          onChange={(e) => setFormData({ ...formData, codigo: e.target.value })}
                          className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 shadow-xs"
                          placeholder="Ex: 001"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Apelido</label>
                        <input
                          type="text"
                          value={formData.apelido}
                          onChange={(e) => setFormData({ ...formData, apelido: e.target.value })}
                          className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 shadow-xs"
                          placeholder="Como é conhecido"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Nome Oficial / Razão Social *</label>
                      <input
                        type="text"
                        value={formData.nome}
                        onChange={(e) => setFormData({ ...formData, nome: e.target.value })}
                        className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 shadow-xs"
                        placeholder="Nome completo do fornecedor"
                        required
                      />
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-600">Produtos Vinculados</label>
                        <span className="text-[11px] font-semibold text-gray-500">{selectedProdutos.length} selecionado(s)</span>
                      </div>

                      {/* Chips de produtos selecionados */}
                      <div className="mb-2 flex flex-wrap gap-1.5 min-h-[44px] p-2.5 border border-gray-200 rounded-xl bg-gray-50 max-h-36 overflow-y-auto">
                        {selectedProdutos.length === 0 ? (
                          <span className="text-gray-400 text-xs self-center">Nenhum produto selecionado. Busque abaixo para adicionar.</span>
                        ) : (
                          selectedProdutos.map(produtoId => {
                            const produto = produtos.find(p => p.id === produtoId);
                            return produto ? (
                              <span key={produtoId} className="bg-red-50 text-red-900 border border-red-200 px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-xs">
                                <span>#{produto.codigo} - {produto.nome}</span>
                                <button type="button" onClick={() => removeProduto(produtoId)} className="text-red-700 hover:text-red-900 hover:bg-red-100 rounded-full p-0.5">
                                  <X className="w-3 h-3" />
                                </button>
                              </span>
                            ) : null;
                          })
                        )}
                      </div>

                      {/* Busca com dropdown */}
                      <div className="relative">
                        <div className="relative">
                          <input
                            type="text"
                            value={produtoSearchTerm}
                            onChange={(e) => setProdutoSearchTerm(e.target.value)}
                            onFocus={() => setShowProdutoDropdown(true)}
                            className="w-full pl-9 pr-3.5 py-2 border border-gray-300 rounded-xl text-xs sm:text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600"
                            placeholder="Buscar produtos para vincular..."
                          />
                          <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <Search className="w-3.5 h-3.5" />
                          </div>
                        </div>

                        {showProdutoDropdown && (
                          <div className="absolute z-20 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-xl max-h-48 overflow-y-auto divide-y divide-gray-100">
                            <div className="flex items-center justify-between px-3 py-1.5 bg-gray-50 text-[10px] font-bold text-gray-500 uppercase">
                              <span>Clique para selecionar / desmarcar</span>
                              <button type="button" onClick={() => setShowProdutoDropdown(false)} className="text-gray-400 hover:text-gray-700">Fechar</button>
                            </div>
                            {filteredProdutosDropdown.length === 0 ? (
                              <div className="px-4 py-3 text-gray-400 text-xs text-center">Nenhum produto correspondente</div>
                            ) : (
                              filteredProdutosDropdown.map(produto => {
                                const isSelected = selectedProdutos.includes(produto.id);
                                return (
                                  <button
                                    key={produto.id}
                                    type="button"
                                    onClick={() => toggleProduto(produto.id)}
                                    className={`w-full px-3.5 py-2 text-left hover:bg-red-50/70 transition-colors flex items-center justify-between ${
                                      isSelected ? 'bg-red-50 text-red-900 font-bold' : 'text-gray-700'
                                    }`}
                                  >
                                    <span className="text-xs">
                                      <span className="font-mono text-[#8a0000] font-bold">#{produto.codigo}</span>
                                      {' • '}
                                      <span>{produto.nome}</span>
                                    </span>
                                    {isSelected && <span className="text-[#8a0000] font-bold text-xs"><Check className="w-3.5 h-3.5 inline" /></span>}
                                  </button>
                                );
                              })
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="bg-gray-50 border-t border-gray-100 px-6 py-4 flex justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={handleCloseModal}
                      className="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-100 transition-colors"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={handleSaveFornecedor}
                      className="rounded-lg bg-[#8a0000] px-5 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-[#a30000] transition-colors"
                    >
                      {editingId ? 'Salvar Alterações' : 'Cadastrar Fornecedor'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Modal de Criação / Edição de Produtos */}
            {showModal && activeTab === 'produtos' && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
                <button className="absolute inset-0 bg-gray-950/50 backdrop-blur-xs w-full h-full border-0 cursor-default" onClick={handleCloseModal} aria-label="Fechar formulário" />
                <div className="relative z-10 w-full max-w-md overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-2xl animate-fade-in">
                  <div className="h-1.5 bg-[#8a0000]" />
                  <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h2 className="text-lg font-bold text-gray-900">
                      {editingId ? 'Editar Produto' : 'Novo Produto'}
                    </h2>
                    <button onClick={handleCloseModal} className="p-1 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-6 space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Código do Produto *</label>
                      <input
                        type="text"
                        value={produtoFormData.codigo}
                        onChange={(e) => setProdutoFormData({ ...produtoFormData, codigo: e.target.value })}
                        className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 shadow-xs"
                        placeholder="Ex: P102"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1.5">Nome / Descrição do Produto *</label>
                      <input
                        type="text"
                        value={produtoFormData.nome}
                        onChange={(e) => setProdutoFormData({ ...produtoFormData, nome: e.target.value })}
                        className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-red-600 shadow-xs"
                        placeholder="Ex: Tomate Carmem 20kg"
                        required
                      />
                    </div>
                  </div>

                  <div className="bg-gray-50 border-t border-gray-100 px-6 py-4 flex justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={handleCloseModal}
                      className="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-bold text-gray-700 hover:bg-gray-100 transition-colors"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      onClick={handleSaveProduto}
                      className="rounded-lg bg-[#8a0000] px-5 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-[#a30000] transition-colors"
                    >
                      {editingId ? 'Salvar Alterações' : 'Cadastrar Produto'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Rodapé institucional padrão */}
            <footer className="mt-auto border-t border-gray-200 bg-white py-4 px-4 sm:px-6">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-gray-500">
                <div className="flex items-center gap-2">
                  <span className="font-bold text-gray-700">Fornecedores CEASA</span>
                  <span>•</span>
                  <span>Sistema Integrado de Fornecedores e Cotações</span>
                </div>
                <div className="flex items-center gap-3 text-gray-400">
                  <span>Padrão Visual Tramita</span>
                  <span>•</span>
                  <span>CEASA 2026</span>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<SistemaFornecedores />);
    </script>
  </body>
</html>
